# nginx does four jobs it ends TLS, works out the visitor's real IP, applies coarse rate limits and forwards the request to the container.

# Lives in the repo and is symlinked into place:
#   sudo ln -sf /opt/insightify/deploy/nginx/app.conf /etc/nginx/sites-enabled/app.conf
#   sudo ln -sf /opt/insightify/deploy/nginx/cloudflare-ips.conf /etc/nginx/cloudflare-ips.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
# Edit it here, never through the symlink. Pull and systemctl reload nginx.

# Coarse flood protection. These are a BACKSTOP, set well above the app's own
# limits (docs/DEPLOY.md 3.2) so the app is what rejects ordinary abuse and
# nginx only fires when something is badly wrong.
#
# $binary_remote_addr is the REAL client address, because cloudflare-ips.conf
# has already rewritten it via real_ip_header.
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m    rate=5r/s;
limit_req_status 429;

upstream insightify_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Cloudflare connects to the origin on 443 under Full (Strict), and ufw does not
# open 80 at all. This block exists only so a stray plaintext request gets a
# clear answer instead of nginx's default site. If an HTTP request somehow reaches port 80, redirect it to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name insightify.saugat030.com.np;

    # Cloudflare Origin Certificate. Valid only for connections from Cloudflare,
    # which is exactly what Full (Strict) makes. No certbot, no renewal cron.
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m; 
    ssl_session_timeout 1d;

    # Resolves the true client IP from CF-Connecting-IP, but ONLY when the
    # connection came from a Cloudflare range. This is the whole reason the
    # app's per-IP limits mean anything - see docs/DEPLOY.md 3.4. basically brings the whole contents of the cloudflare-ips.conf file into this file.
    include /etc/nginx/cloudflare-ips.conf;

    # The app scrapes pages and calls Gemini on POST /api/links, which can be
    # slow. Cloudflare's free plan gives up at 100s regardless, so there is no
    # point waiting longer than that here.
    proxy_read_timeout    100s;
    proxy_send_timeout    100s;
    client_max_body_size  25m;

    # adds headers to responses
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Auth endpoints get the tighter zone. burst absorbs a legitimate burst
    # (a page load firing several calls); nodelay serves them immediately
    # rather than queueing.
    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        # insightify_app defined this earlier in upstream block
        proxy_pass http://insightify_app;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=general burst=50 nodelay;

        proxy_pass http://insightify_app;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

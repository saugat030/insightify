# Kept at the repo root so `build: .` gets the whole project as its context.
# A compose file under deploy/ would resolve the context to deploy/, which has
# no package.json. See docs/DEPLOY.md §4.

services:
  web:
    build:
      context: .
      # Baked into the prerendered pages, so it is a BUILD input, not a
      # runtime one. Changing it needs a rebuild, not just a restart.
      args:
        # left = the ARG name the Dockerfile declares and right = where compose looks the value up (shell, else .env).
        BUILD_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    env_file: [.env]
    environment:
      # reached over the compose network redis publishes no ports.
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
      NODE_ENV: production
    # Loopback only. Publishing 3000:3000 would write iptables rules that bypass ufw and since nginx runs on the host so loopback is all it needs.
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # No ports: Publishing it would expose 6379 to the internet
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
      --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
